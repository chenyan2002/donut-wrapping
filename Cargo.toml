[workspace]
members = [
  "crates/donut-plan",
  "crates/donut",
  "crates/donut-tests",
  "examples/http/guest",
  "examples/http/server",
  "examples/fastly/host",
  "examples/shapes/guest",
  "examples/shapes/donut",
  "examples/shapes/init-donut",
  "examples/record/app",
  "examples/record/recorder",
]
exclude = ["spike"]
resolver = "2"

[workspace.package]
edition = "2024"
version = "0.1.0"
license = "Apache-2.0 WITH LLVM-exception OR Apache-2.0 OR MIT"

[workspace.dependencies]
anyhow = "1"
heck = "0.5"
proc-macro2 = "1"
quote = "1"
syn = { version = "2", features = ["full"] }
wit-bindgen = "0.63.0"
wit-bindgen-core = "0.63.0"
wit-bindgen-rust = "0.63.0"
wit-component = "0.263.0"
wit-parser = "0.263.0"
donut-plan = { path = "crates/donut-plan" }
donut = { path = "crates/donut" }

# Local checkouts with the changes this project needs, until they're released:
# wit-bindgen `donut` branch (`import_module_prefix`) and wasm-tools `donut`
# branch (wit-component donut mode, `wit_component::donut`). The wasm-tools
# branch is based on the 1.263.0 release because wit-bindgen 0.63 builds
# against wasm-tools 0.263 (later wasm-tools `main` changed the wit-parser ABI
# API).
[patch.crates-io]
wit-bindgen = { path = "../bytecodealliance/wit-bindgen/crates/guest-rust" }
wit-bindgen-rust-macro = { path = "../bytecodealliance/wit-bindgen/crates/guest-rust/macro" }
wit-bindgen-rust = { path = "../bytecodealliance/wit-bindgen/crates/rust" }
wit-bindgen-core = { path = "../bytecodealliance/wit-bindgen/crates/core" }
wit-component = { path = "../bytecodealliance/wasm-tools/crates/wit-component" }
wit-parser = { path = "../bytecodealliance/wasm-tools/crates/wit-parser" }
wasm-encoder = { path = "../bytecodealliance/wasm-tools/crates/wasm-encoder" }
wasm-metadata = { path = "../bytecodealliance/wasm-tools/crates/wasm-metadata" }
wasmparser = { path = "../bytecodealliance/wasm-tools/crates/wasmparser" }

[profile.release]
opt-level = "s"
debug = false
strip = true
