[workspace]
members = [
  "crates/donut-plan",
  "crates/donut",
  "crates/donut-tests",
  "examples/virtualize/guest",
  "examples/virtualize/donut",
  "examples/virtualize/init/donut",
  "examples/forward/app",
  "examples/forward/recorder",
  "examples/forward/interceptor",
  "examples/fastly/host",
  "examples/secrets/app",
  "examples/secrets/donut",
]
exclude = ["spike"]
resolver = "2"

[workspace.package]
edition = "2024"
version = "0.1.0"
license = "Apache-2.0 WITH LLVM-exception OR Apache-2.0 OR MIT"

[workspace.dependencies]
anyhow = "1"
heck = "0.5"
indexmap = "2"
proc-macro2 = "1"
quote = "1"
syn = { version = "2", features = ["full"] }
wit-bindgen = "0.63.0"
wit-bindgen-core = "0.63.0"
wit-bindgen-rust = "0.63.0"
wit-component = "0.263.0"
wit-parser = "0.263.0"
donut-plan = { path = "crates/donut-plan" }
donut = { path = "crates/donut" }

# Unreleased changes this project needs, from the `donut` branches of the forks:
# * wit-bindgen: the `import_module_prefix` option;
# * wasm-tools: wit-component's donut mode (`wit_component::donut`,
#   `wasm-tools component new --donut-guest`).
# The wasm-tools branch is based on the 1.263.0 release because wit-bindgen
# 0.63 builds against wasm-tools 0.263.
[patch.crates-io]
wit-bindgen = { git = "https://github.com/chenyan2002/wit-bindgen", branch = "donut" }
wit-bindgen-rust-macro = { git = "https://github.com/chenyan2002/wit-bindgen", branch = "donut" }
wit-bindgen-rust = { git = "https://github.com/chenyan2002/wit-bindgen", branch = "donut" }
wit-bindgen-core = { git = "https://github.com/chenyan2002/wit-bindgen", branch = "donut" }
wit-component = { git = "https://github.com/chenyan2002/wasm-tools", branch = "donut" }
wit-parser = { git = "https://github.com/chenyan2002/wasm-tools", branch = "donut" }
wasm-encoder = { git = "https://github.com/chenyan2002/wasm-tools", branch = "donut" }
wasm-metadata = { git = "https://github.com/chenyan2002/wasm-tools", branch = "donut" }
wasmparser = { git = "https://github.com/chenyan2002/wasm-tools", branch = "donut" }

[profile.release]
opt-level = "s"
debug = false
strip = true
